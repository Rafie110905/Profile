<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-labelledby="rfTitle">
  <title id="rfTitle">Terima kasih sudah berkunjung</title>
  <defs>
    <linearGradient id="rfBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.5" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="rfLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="110" fill="url(#rfBg)"/>
  <rect x="100" y="38" width="1000" height="2" fill="url(#rfLine)"/>
  <circle cy="39" r="4" fill="#E5B5C7">
    <animate attributeName="cx" values="100;1100;100" dur="10s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="78" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#E5B5C7">Terima kasih sudah berkunjung.</text>
</svg>
