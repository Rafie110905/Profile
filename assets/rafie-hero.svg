<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="rhTitle rhDesc">
  <title id="rhTitle">Moh Rafie Nazar J</title>
  <desc id="rhDesc">Mahasiswa Teknik Informatika dan Full Stack Developer</desc>
  <defs>
    <linearGradient id="rhBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <radialGradient id="rhGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rhLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D">
        <animate attributeName="stop-color" values="#701A3D;#C77B9B;#701A3D" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <linearGradient id="rhUnder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.6" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <pattern id="rhGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E5B5C7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="rhBlur" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#rhBg)"/>
  <rect width="1200" height="340" fill="url(#rhGrid)"/>

  <!-- cahaya bergerak -->
  <ellipse cx="300" cy="170" rx="360" ry="200" fill="url(#rhGlow)">
    <animate attributeName="cx" values="300;900;300" dur="16s" repeatCount="indefinite"/>
  </ellipse>

  <!-- geometri orbital -->
  <g transform="translate(985 170)" fill="none" stroke="#C77B9B">
    <circle r="62" stroke-opacity="0.35"/>
    <circle r="105" stroke-opacity="0.22" stroke-dasharray="3 9"/>
    <ellipse rx="150" ry="52" stroke-opacity="0.25" transform="rotate(-20)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      <circle cx="105" cy="0" r="5" fill="#E5B5C7" stroke="none"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
      <circle cx="62" cy="0" r="3.5" fill="#C77B9B" stroke="none"/>
    </g>
  </g>

  <!-- path beranimasi -->
  <path d="M0 300 C 180 230, 330 320, 560 262 S 900 210, 1200 268" fill="none" stroke="url(#rhLine)" stroke-width="2" stroke-linecap="round" pathLength="1">
    <animate attributeName="stroke-dasharray" values="0 1;1 0;1 0" keyTimes="0;0.6;1" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- teks -->
  <text x="70" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#F8F0F3" letter-spacing="1">Moh Rafie Nazar J</text>
  <text x="72" y="198" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#E5B5C7" letter-spacing="0.5">Mahasiswa Teknik Informatika  |  Full Stack Developer</text>
  <text x="72" y="232" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#C77B9B">Universitas Trunojoyo Madura  ·  Bangkalan, Jawa Timur</text>

  <!-- garis bawah bercahaya -->
  <rect x="72" y="250" width="420" height="3" rx="1.5" fill="url(#rhUnder)" filter="url(#rhBlur)" opacity="0.8">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="72" y="250" width="420" height="3" rx="1.5" fill="url(#rhUnder)"/>
</svg>
